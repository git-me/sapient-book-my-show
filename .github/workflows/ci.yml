name: CI

# GitHub does not offer a free hosting environment for a backend Spring Boot
# service (GitHub Pages is static-content only), so this workflow does the two
# things that ARE genuinely free and GitHub-native:
#   1. build-and-test: runs the real Testcontainers suite on GitHub-hosted
#      runners (Docker is preinstalled there, so the MySQL containers in
#      AbstractIntegrationTest work exactly as they do locally).
#   2. publish-image: pushes the built Docker image to GitHub Container
#      Registry (ghcr.io), which is free for this repo and needs no secrets
#      beyond the automatically-provided GITHUB_TOKEN. That gets you a
#      versioned, pullable image - actually running it still needs a host
#      (Render/Fly.io/EC2/your own server/etc.), since GHCR is a registry,
#      not a hosting platform.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
